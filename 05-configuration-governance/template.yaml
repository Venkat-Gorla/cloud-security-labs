AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cloud Security Lab 05 - Configuration Governance

Parameters:
  ProjectPrefix:
    Type: String
    Default: cloud-security-config-lab

Resources:
  ConfigLabTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectPrefix}-table"
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH

      Tags:
        - Key: Project
          Value: !Ref ProjectPrefix

        - Key: ManagedBy
          Value: CloudFormation

  ConfigLabFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-handler"
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.12
      MemorySize: 128
      Timeout: 10
      Architectures:
        - arm64

      Environment:
        Variables:
          TABLE_NAME: !Ref ConfigLabTable

      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ConfigLabTable.Arn

      Tags:
        Project: !Ref ProjectPrefix
        ManagedBy: CloudFormation
